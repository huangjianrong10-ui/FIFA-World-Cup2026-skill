<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣球迷 2026 世界盃行程規劃</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="planner">
      <header>
        <p>TAIWAN FAN TRIP PLANNER</p>
        <h1>2026 世界盃赴美觀賽行程規劃</h1>
      </header>
      <div class="controls">
        <label>觀賽城市
          <select id="city">
            <option value="west">西岸：洛杉磯 / 舊金山灣區 / 西雅圖</option>
            <option value="central">中南部：達拉斯 / 休士頓 / 堪薩斯城 / 亞特蘭大</option>
            <option value="east">東岸：紐約紐澤西 / 費城 / 波士頓 / 邁阿密</option>
          </select>
        </label>
        <label>行程天數 <output id="daysOut">10 天</output>
          <input id="days" type="range" min="6" max="21" value="10">
        </label>
        <label>觀賽場次 <output id="matchesOut">2 場</output>
          <input id="matches" type="range" min="1" max="5" value="2">
        </label>
        <label>每人預算上限（TWD）
          <input id="budget" type="number" min="80000" step="5000" value="180000">
        </label>
        <button id="run">產生建議</button>
      </div>
    </section>
    <section class="result">
      <div class="score">
        <span id="score">82</span>
        <p id="status">節奏穩定，適合第一次赴美看球。</p>
      </div>
      <div class="grid">
        <article>
          <h2>建議路線</h2>
          <p id="route"></p>
        </article>
        <article>
          <h2>預算估算</h2>
          <p id="cost"></p>
        </article>
        <article>
          <h2>優先處理</h2>
          <ul id="tasks"></ul>
        </article>
        <article>
          <h2>風險提醒</h2>
          <ul id="risks"></ul>
        </article>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
